[project]
name = "pypop"
version = "0.1.0"
description = "A pluggable pop3 server"
requires-python = ">=3.13"

dependencies = [
    "asyncio>=4.0.0",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "codespell>=2.4.2",
    "mypy>=2.1.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.3.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.setuptools.packages.find]
where = ["src"]
